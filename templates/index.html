<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天気予報アプリ</title>
  </head>
<body>
  <h1>天気予報</h1>
  
  <form id="area-form" action="/" method="get">
    <select id="area" name="area">
      <option value="">-- 地域を選択 --</option>
      {% for name in areas %}
        <option value="{{ name }}">{{ name }}</option>
      {% endfor %}
    </select>
    <button type="submit">送信</button>
  </form>

  <hr>

  <div id="result">
    {% if result_text %}
        <h2>予報結果:</h2>
        <p>{{ result_text }}</p>
    {% endif %}

    {% if error_message %}
        <p style="color: red;">{{ error_message }}</p>
    {% endif %}
  </div>
</body>
</html>
