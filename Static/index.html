<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天気予報</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <!-- <link rel="stylesheet" href="/style.css"> -->
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">天気予報</h1>

        <div class="d-flex align-items-center mb-3">
            <select id="areaSelect" class="form-select w-auto me-2">
            <option value="">-- 地域を選択 --</option>
        </select>
        <button id="getWeatherBtn" class="btn btn-primary">取得</button>
        </div>

        <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>

        <div id="weatherResult" class="mt-4">

        </div>
    </div>

    <!-- <script src="/script.js"></script> -->
    <script type="module">
        const response = await fetch("/api/areas");
        const data = await response.json();
        console.log(data)
        const select = document.getElementById("areaSelect");
        data.forEach(area => {
            const option = document.createElement("option");
            option.value = area.code;
            option.textContent = area.name;
            select.appendChild(option);
        });
        
        const getWeatherBtn = document.getElementById("getWeatherBtn");
        select.addEventListener("change", changed);
        function changed(e){
            const selectedOption = e.target.selectedOptions[0];
            console.log(selectedOption.value);
        }
        // const response2 = await fetch(`/api/weather/${value}`);

    </script>
</body>
</html>
