<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天気予報</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="shell">
        <section class="hero">
            <p class="eyebrow">Minimal Forecast</p>
            
        </section>

        <ul id="Login" class="view-panel auth-layout" style="display: none;">
            <div id="login form" class="panel auth-card">
                <p class="panel-kicker">Login</p>
                <h2>ログイン</h2>
                <p class="panel-copy">登録済みのアカウントで天気ダッシュボードに入ります。</p>
                <div class="field-group">
                    <label for="login_username">ユーザー名</label>
                    <input type="text" id="login_username" placeholder="username">
                </div>
                <div class="field-group">
                    <label for="login_password">パスワード</label>
                    <input type="password" id="login_password" placeholder="password" required>
                </div>
                <div class="field-group">
                    <input id="getLoginData" class="button button-primary" type="submit" value="ログイン">
                </div>
                <div id="loginErrorMessage" class="error-banner d-none" role="alert"></div>
            </div>

            <div id="register form" class="panel auth-card">
                <p class="panel-kicker">Register</p>
                <h2>新規登録</h2>
                <p class="panel-copy">ユーザー名とパスワードを登録して利用を開始します。</p>
                <div class="field-group">
                    <label for="register_username">ユーザー名</label>
                    <input type="text" id="register_username" placeholder="new username">
                </div>
                <div class="field-group">
                    <label for="register_password">パスワード</label>
                    <input type="password" id="register_password" placeholder="6文字以上で入力" required>
                </div>
                <div class="field-group">
                    <input id="getRegisterData" class="button button-secondary" type="submit" value="登録">
                </div>
                <div id="registerErrorMessage" class="error-banner d-none" role="alert"></div>
                <div id="registerSuccessMessage" class="success-banner d-none" role="status" aria-live="polite"></div>
            </div>
        </ul>

        <ul id="WeatherApp" class="view-panel weather-layout" style="display: none;">
            <section class="panel weather-card">
                <div class="weather-head">
                    <div>
                        <p class="panel-kicker">Forecast</p>
                        <h2>天気予報</h2>
                        <p class="panel-copy">地域を選択して、今日の天気を表示します。</p>
                    </div>
                    <button id="logoutButtun" class="button button-secondary" type="button">Logout</button>
                </div>

                <div class="weather-controls">
                    <div class="field-group">
                        <label for="areaTrigger">地域</label>
                        <div class="select-shell" id="areaDropdown">
                            <button
                                id="areaTrigger"
                                class="select-trigger"
                                type="button"
                                aria-haspopup="listbox"
                                aria-expanded="false"
                                aria-controls="areaOptions"
                            >
                                <span id="areaTriggerLabel">-- 地域を選択 --</span>
                            </button>
                            <div id="areaOptions" class="select-options d-none" role="listbox" aria-labelledby="areaTrigger"></div>
                        </div>
                    </div>
                    <button id="getWeatherBtn" class="button button-primary" type="button">取得</button>
                </div>

                <div id="weatherErrorMessage" class="error-banner d-none" role="alert"></div>

                <div id="weatherResult" class="weather-result">
                    <div class="weather-empty">
                        <p class="weather-empty-title">Forecast Ready</p>
                        <p class="weather-empty-copy">地域を選ぶと、ここに天気情報が表示されます。</p>
                    </div>
                </div>
            </section>
        </ul>
    </main>

    <script type="module" src="/static/app.js"></script>
</body>
</html>
